name: Bootstrap verified football data
description: Download and verify the pinned private historical snapshot into an isolated runtime home.
inputs:
  runtime-access-key-id:
    description: Repository secret used only for read-only runtime access.
    required: true
  runtime-secret-access-key:
    description: Repository secret used only for read-only runtime access.
    required: true
  manifest:
    description: Exact tracked runtime manifest path.
    required: false
    default: data/football_data/runtime_snapshot_manifest.json
runs:
  using: composite
  steps:
    - name: Load runtime configuration without logging values
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUNTIME_ACCESS_KEY_ID: ${{ inputs.runtime-access-key-id }}
        RUNTIME_SECRET_ACCESS_KEY: ${{ inputs.runtime-secret-access-key }}
      run: |
        set -euo pipefail

        load_variable() {
          local name="$1"
          local value
          if ! value="$(gh api --jq '.value' "repos/${GITHUB_REPOSITORY}/actions/variables/${name}" 2>/dev/null)"; then
            echo "GITHUB_RUNTIME_CONFIG_MISSING"
            exit 1
          fi
          if [[ -z "$value" || "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
            echo "GITHUB_RUNTIME_CONFIG_MISSING"
            exit 1
          fi
          printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
        }

        load_variable FOOTBALL_DATA_SNAPSHOT_ENDPOINT_URL
        load_variable FOOTBALL_DATA_SNAPSHOT_BUCKET
        load_variable FOOTBALL_DATA_SNAPSHOT_REGION

        if [[ -z "${RUNTIME_ACCESS_KEY_ID:-}" || -z "${RUNTIME_SECRET_ACCESS_KEY:-}" ]]; then
          echo "GITHUB_RUNTIME_CONFIG_MISSING"
          exit 1
        fi
        {
          printf 'FOOTBALL_DATA_SNAPSHOT_RUNTIME_ACCESS_KEY_ID=%s\n' "$RUNTIME_ACCESS_KEY_ID"
          printf 'FOOTBALL_DATA_SNAPSHOT_RUNTIME_SECRET_ACCESS_KEY=%s\n' "$RUNTIME_SECRET_ACCESS_KEY"
        } >> "$GITHUB_ENV"

    - name: Bootstrap exact snapshot
      shell: bash
      run: |
        set -euo pipefail
        python -m scripts.football_data.bootstrap_runtime_data \
          --manifest "${{ inputs.manifest }}" \
          --runtime-temp "$RUNNER_TEMP/football-data" \
          --data-home "$RUNNER_TEMP/football-data/runtime" \
          --github-env "$GITHUB_ENV" \
          --health-path "$RUNNER_TEMP/football-data/runtime_snapshot_health.json"
