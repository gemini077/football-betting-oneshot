name: Exact distribution freeze contract

on:
  pull_request:
    paths:
      - "scripts/automatic_model_core.py"
      - "scripts/exact_distribution.py"
      - "scripts/official_jc_handicap.py"
      - "scripts/official_jc_handicap_source_audit.py"
      - "scripts/fetch_sporttery.py"
      - "scripts/exact_distribution_freeze_readiness_audit.py"
      - "scripts/model_governance.py"
      - "scripts/base_prediction_runner.py"
      - "scripts/deepseek_auto_analysis.py"
      - "scripts/generate_analysis_report.py"
      - "scripts/prospective_settlement.py"
      - "scripts/automatic_postmatch_review.py"
      - "schemas/exact_score_distribution.schema.json"
      - "schemas/jc_total_goals.schema.json"
      - "schemas/jc_handicap.schema.json"
      - "tests/test_exact_distribution_freeze.py"
      - "tests/fixtures/exact_distribution/current_model_input.json"
      - "tests/test_automatic_model_core.py"
      - "tests/test_model_governance.py"
      - "tests/test_base_prediction_runner.py"
      - "tests/test_prospective_settlement.py"
      - "tests/test_automatic_postmatch_review.py"
      - "tests/test_market_contracts.py"
      - "tests/test_prediction_universe.py"
      - "tests/test_jc_handicap_official_line.py"
      - "tests/test_jc_handicap_source_audit.py"
      - "tests/fixtures/jc_handicap/official_source_audit.json"
      - "docs/exact-distribution-freeze.md"
      - ".github/workflows/exact-distribution-freeze.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-readiness:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run focused Exact distribution tests
        run: >-
          python -m pytest -q
          tests/test_exact_distribution_freeze.py
          tests/test_automatic_model_core.py
          tests/test_model_governance.py
          tests/test_base_prediction_runner.py
          tests/test_prospective_settlement.py
          tests/test_automatic_postmatch_review.py
          tests/test_market_contracts.py
          tests/test_prediction_universe.py
          tests/test_jc_handicap_official_line.py
          tests/test_jc_handicap_source_audit.py

      - name: Compile changed Python paths
        run: >-
          python -m py_compile
          scripts/automatic_model_core.py
          scripts/exact_distribution.py
          scripts/official_jc_handicap.py
          scripts/official_jc_handicap_source_audit.py
          scripts/fetch_sporttery.py
          scripts/exact_distribution_freeze_readiness_audit.py
          scripts/model_governance.py
          scripts/base_prediction_runner.py
          scripts/deepseek_auto_analysis.py
          scripts/generate_analysis_report.py
          scripts/prospective_settlement.py
          scripts/automatic_postmatch_review.py
          scripts/market_contracts.py
          scripts/prediction_universe.py

      - name: Run bounded offline repository-data audit
        run: python scripts/exact_distribution_freeze_readiness_audit.py --limit 200 --output exact-distribution-readiness.json

      - name: Check diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || 'HEAD^' }}...${{ github.sha }}"

      - name: Upload readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: exact-distribution-readiness
          path: exact-distribution-readiness.json

  live-jc-handicap-source-audit:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run bounded live Sporttery source audit
        id: live-audit
        run: |
          set +e
          python scripts/official_jc_handicap_source_audit.py \
            --output jc-handicap-live-source-audit.json
          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit "$exit_code"

      - name: Upload live source audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jc-handicap-live-source-audit
          path: jc-handicap-live-source-audit.json
          if-no-files-found: warn
