name: FBOS Free Alternative Source Probe
on:
  push:
    branches: [fbos/free-runner-proof-20261015]
    paths: [".github/workflows/fbos-free-alt-sources.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Audit independently accessible public football data from hosted Linux
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,hashlib
          sources={
            "espn_europa_scoreboard":"https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa/scoreboard?dates=20261015",
            "football_500_public":"https://trade.500.com/jczq/",
          }
          results={}
          for label,url in sources.items():
              try:
                  request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 FBOS provenance probe","Accept":"application/json,text/html,*/*"})
                  with urllib.request.urlopen(request,timeout=12) as resp:
                      body=resp.read(4_000_001)
                      assert len(body)<=4_000_000
                      results[label]={"status":"http_success","http":resp.status,"bytes":len(body),"sha256":hashlib.sha256(body).hexdigest()}
                      if label=="espn_europa_scoreboard":
                          js=json.loads(body)
                          assert isinstance(js.get("events"),list)
                          results[label]["event_count"]=len(js["events"])
              except Exception as exc:
                  results[label]={"status":"failed_closed","reason":type(exc).__name__,"http":getattr(exc,"code",None)}
          print(json.dumps({"mode":"research_source_provenance_only","sources":results},sort_keys=True))
          assert results["espn_europa_scoreboard"]["status"]=="http_success"
          PY
