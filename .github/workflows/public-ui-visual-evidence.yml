name: Public UI visual evidence

on:
  pull_request:
    paths:
      - "scripts/prediction_dashboard.py"
      - "scripts/match_detail.py"
      - "scripts/formal_market_projection.py"
      - "scripts/build_public_site.py"
      - "scripts/exact_score_serving_policy.py"
      - "scripts/capture_public_ui_evidence.py"
      - "tests/test_prediction_dashboard.py"
      - "tests/test_match_analysis.py"
      - "tests/test_build_public_site.py"
      - "tests/test_formal_market_projection.py"
      - "tests/test_exact_score_serving_policy.py"
      - ".github/workflows/public-ui-visual-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Run focused pytest
        run: |
          python -m pytest -q \
            tests/test_prediction_dashboard.py \
            tests/test_match_analysis.py \
            tests/test_build_public_site.py \
            tests/test_formal_market_projection.py \
            tests/test_exact_score_serving_policy.py

      - name: Install Playwright
        run: pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build temporary public site
        run: python scripts/build_public_site.py --output site

      - name: Capture Chromium evidence
        run: python scripts/capture_public_ui_evidence.py --site-root site --output-dir visual-evidence

      - name: Upload evidence artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: public-ui-visual-evidence-${{ github.event.pull_request.number || github.run_id }}
          path: visual-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Publish evidence manifest to job summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## PUBLIC-UI-USER-JOB-LOCKED-IMPLEMENTATION-1"
            echo
            echo "run_id=${{ github.run_id }}"
            echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
            echo "source_commit_sha=${{ env.SOURCE_COMMIT_SHA }}"
            echo
            cat visual-evidence/manifest.json
          } >> "$GITHUB_STEP_SUMMARY"
