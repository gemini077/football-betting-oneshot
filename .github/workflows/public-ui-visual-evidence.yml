name: Public UI visual evidence

on:
  pull_request:
    paths:
      - "scripts/prediction_dashboard.py"
      - "scripts/match_detail.py"
      - "scripts/match_analysis.py"
      - "scripts/change_awareness.py"
      - "scripts/formal_market_projection.py"
      - "scripts/build_public_site.py"
      - "scripts/team_crest_enrichment.py"
      - "scripts/exact_score_serving_policy.py"
      - "scripts/capture_public_ui_evidence.py"
      - "tests/test_prediction_dashboard.py"
      - "tests/test_match_analysis.py"
      - "tests/test_change_awareness.py"
      - "tests/test_build_public_site.py"
      - "tests/test_team_crest_enrichment.py"
      - "tests/test_formal_market_projection.py"
      - "tests/test_exact_score_serving_policy.py"
      - ".github/workflows/public-ui-visual-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Run focused pytest
        run: |
          python -m pytest -q \
            tests/test_team_crest_enrichment.py \
            tests/test_change_awareness.py \
            tests/test_prediction_dashboard.py \
            tests/test_match_analysis.py \
            tests/test_build_public_site.py \
            tests/test_formal_market_projection.py \
            tests/test_exact_score_serving_policy.py

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            scripts/change_awareness.py \
            scripts/match_analysis.py \
            scripts/match_detail.py \
            scripts/build_public_site.py \
            scripts/team_crest_enrichment.py \
            scripts/capture_public_ui_evidence.py

      - name: Install Playwright
        run: pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build temporary public site
        run: python scripts/build_public_site.py --output site

      - name: Scan generated Match Detail HTML for #274 leakage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pages = sorted(Path("site/matches").glob("*/index.html"))
          forbidden = (
              "model_family",
              "release_version",
              "data_grade",
              "base_input_quality",
              "status_code",
              "FROZEN",
              "PRESENT",
              "PARSE_UNCERTAIN",
              "prediction_id",
              "selected_prediction_id",
              "job_id",
              "input_snapshot_ref",
              '<details class="technical-details">',
          )
          leaks = {}
          for page in pages:
              html = page.read_text(encoding="utf-8")
              found = [token for token in forbidden if token in html]
              if found:
                  leaks[str(page)] = found
          report = {
              "status": "PASS" if len(pages) == 12 and not leaks else "FAIL",
              "page_count": len(pages),
              "scanned_pages": [str(page) for page in pages],
              "forbidden_tokens": list(forbidden),
              "leaks": leaks,
          }
          output = Path("visual-evidence/match-detail-html-leakage-scan.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if report["status"] != "PASS":
              print(json.dumps(report, ensure_ascii=False, indent=2))
              raise SystemExit("Generated Match Detail HTML leakage scan failed")
          print("12/12 Match Detail HTML leakage scan: PASS")
          PY

      - name: Capture Chromium evidence
        run: python scripts/capture_public_ui_evidence.py --site-root site --output-dir visual-evidence

      - name: Upload evidence artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: public-ui-visual-evidence-${{ github.event.pull_request.number || github.run_id }}
          path: visual-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Publish evidence manifest to job summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## PUBLIC-UI-USER-JOB-LOCKED-IMPLEMENTATION-1"
            echo
            echo "run_id=${{ github.run_id }}"
            echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
            echo "source_commit_sha=${{ env.SOURCE_COMMIT_SHA }}"
            echo
            cat visual-evidence/manifest.json
          } >> "$GITHUB_STEP_SUMMARY"
