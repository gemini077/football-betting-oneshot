name: Production BASE prediction timeout closure

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/automation_cycle.py"
      - "scripts/base_prediction_runner.py"
      - "tests/test_automation_cycle.py"
      - "tests/test_base_prediction_runner.py"
      - "tests/test_github_production_workflow.py"
      - ".github/workflows/production-base-prediction-timeout-closure.yml"

permissions:
  contents: read

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_automation_cycle.py
          tests/test_base_prediction_runner.py
          tests/test_github_production_workflow.py

      - name: Compile touched Python modules and tests
        run: >-
          python -m py_compile
          scripts/automation_cycle.py
          scripts/base_prediction_runner.py
          tests/test_automation_cycle.py
          tests/test_base_prediction_runner.py

      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
