name: FOOTBALL State Memory contract

on:
  pull_request:
    paths:
      - "scripts/base_prediction_runner.py"
      - "scripts/football_state_memory.py"
      - "scripts/football_state_memory_readiness_audit.py"
      - "scripts/nowscore_markets.py"
      - "schemas/football_state_memory.schema.json"
      - "tests/test_base_prediction_runner.py"
      - "tests/test_football_state_memory.py"
      - "tests/test_nowscore_markets.py"
      - "tests/fixtures/nowscore_state_memory/current_source_sample.json"
      - "docs/football-state-memory.md"
      - ".github/workflows/football-state-memory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-readiness:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run focused State Memory tests
        run: python -m pytest -q tests/test_football_state_memory.py tests/test_base_prediction_runner.py tests/test_nowscore_markets.py

      - name: Compile changed Python paths
        run: python -m py_compile scripts/football_state_memory.py scripts/football_state_memory_readiness_audit.py scripts/base_prediction_runner.py scripts/nowscore_markets.py

      - name: Run offline current-source readiness audit
        run: python scripts/football_state_memory_readiness_audit.py --limit 200 --output state-memory-readiness.json

      - name: Check diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || 'HEAD^' }}...${{ github.sha }}"

      - name: Upload readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-state-memory-readiness
          path: state-memory-readiness.json
