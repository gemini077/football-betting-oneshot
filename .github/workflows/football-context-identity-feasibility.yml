name: Football Context Identity Feasibility

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/football_context_identity_feasibility_audit.py"
      - "tests/test_football_context_identity_feasibility.py"
      - ".github/workflows/football-context-identity-feasibility.yml"
  workflow_dispatch:
    inputs:
      business_date:
        description: "READY prediction-universe business date; blank selects the latest READY cohort"
        required: false
        default: ""
      as_of:
        description: "Prematch cutoff timestamp; blank uses runner time"
        required: false
        default: ""
      max_matches:
        description: "Maximum current natural-cohort fixtures to audit"
        required: false
        default: "12"

permissions:
  contents: read

jobs:
  exact-head-identity-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head and bounded file scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          EXPECTED_HEAD="${HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            while IFS= read -r path; do
              case "$path" in
                scripts/football_context_identity_feasibility_audit.py|tests/test_football_context_identity_feasibility.py|.github/workflows/football-context-identity-feasibility.yml) ;;
                *) echo "out-of-scope file: $path"; exit 1 ;;
              esac
            done < <(git diff --name-only "$BASE_SHA...$EXPECTED_HEAD")
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused identity feasibility tests
        run: python -m pytest -q tests/test_football_context_identity_feasibility.py

      - name: Run accepted Nowscore regression tests
        run: python -m pytest -q tests/test_nowscore_context_depth.py tests/test_nowscore_prematch_evidence.py

      - name: Compile touched audit and test paths
        run: |
          python -m py_compile \
            scripts/football_context_identity_feasibility_audit.py \
            tests/test_football_context_identity_feasibility.py

      - name: Run exact-head live natural-cohort audit
        shell: bash
        env:
          BUSINESS_DATE: ${{ inputs.business_date || '' }}
          AS_OF: ${{ inputs.as_of || '' }}
          MAX_MATCHES: ${{ inputs.max_matches || '12' }}
        run: |
          args=(--max-matches "$MAX_MATCHES" --output football-context-identity-feasibility-audit.json)
          if [[ -n "$BUSINESS_DATE" ]]; then
            args+=(--business-date "$BUSINESS_DATE")
          fi
          if [[ -n "$AS_OF" ]]; then
            args+=(--as-of "$AS_OF")
          fi
          python scripts/football_context_identity_feasibility_audit.py "${args[@]}" | tee football-context-identity-feasibility-audit.log
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path("football-context-identity-feasibility-audit.json").read_text(encoding="utf-8"))
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if report["run"]["exact_head"] != head:
              raise SystemExit("audit exact_head does not match checked-out HEAD")
          if report["run"]["natural_cohort_count"] <= 0:
              raise SystemExit("natural cohort is empty")
          api = report["api_football"]
          if api["request_count"] > api["request_cap"] or api["request_cap"] != 25:
              raise SystemExit("API-Football request cap failed")
          if set(api["endpoint_counts"]) != {"/fixtures", "/leagues"}:
              raise SystemExit("unexpected API-Football endpoint")
          if any(api["forbidden_endpoint_counts"].values()):
              raise SystemExit("standings/injuries endpoint was called")
          nowscore = report["nowscore"]["direct_competition_bridge"]
          api_bridge = api["fixture_bridge"]
          if sum(nowscore["status_counts"].values()) != report["run"]["natural_cohort_count"]:
              raise SystemExit("Nowscore bridge counts do not cover the cohort")
          if sum(api_bridge["status_counts"].values()) != report["run"]["natural_cohort_count"]:
              raise SystemExit("API fixture bridge counts do not cover the cohort")
          proof = report["boundary_proof"]
          for key in (
              "raw_body_persistence_count",
              "raw_body_output_marker_count",
              "secret_leakage_count",
              "orientation_swap_attempt_count",
              "date_only_binding_count",
              "kickoff_only_binding_count",
              "standings_endpoint_call_count",
              "injuries_endpoint_call_count",
          ):
              if proof[key] != 0:
                  raise SystemExit(f"boundary proof failed: {key}={proof[key]}")
          for key in (
              "fuzzy_matching_used",
              "manual_mapping_used",
              "production_enrichment_written",
              "production_mapping_file_created",
              "article_changed",
              "ui_changed",
              "model_changed",
              "champion_changed",
              "serving_changed",
          ):
              if proof[key] is not False:
                  raise SystemExit(f"boundary proof failed: {key}={proof[key]}")
          print(json.dumps({
              "natural_cohort_count": report["run"]["natural_cohort_count"],
              "nowscore_direct_competition_bridge": nowscore,
              "api_fixture_bridge": api_bridge,
              "api_request_count": api["request_count"],
              "api_endpoint_counts": api["endpoint_counts"],
              "league_season_coverage_pairs": api["league_season_coverage_pairs"],
              "boundary_proof": proof,
          }, ensure_ascii=False))
          PY

      - name: Publish exact-head audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## FOOTBALL-CONTEXT-IDENTITY-FEASIBILITY-R1"
            echo
            cat football-context-identity-feasibility-audit.log 2>/dev/null || true
            echo
            cat football-context-identity-feasibility-audit.json 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check patch whitespace
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git diff --check
          fi

      - name: Upload exact-head sanitized audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-context-identity-feasibility-${{ github.event.pull_request.number || github.run_id }}
          path: |
            football-context-identity-feasibility-audit.json
            football-context-identity-feasibility-audit.log
          if-no-files-found: error
          retention-days: 14
