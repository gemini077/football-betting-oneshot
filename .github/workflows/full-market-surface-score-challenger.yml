name: Full market surface score challenger 1

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/full-market-surface-score-challenger.yml"
      - "scripts/full_market_surface_score_challenger.py"
      - "scripts/market_implied_score_baseline_audit.py"
      - "scripts/market_contracts.py"
      - "scripts/model_governance.py"
      - "scripts/prediction_quality.py"
      - "scripts/market_side_shadow.py"
      - "scripts/market_side_shadow_refresh.py"
      - "tests/test_full_market_surface_score_challenger.py"
      - "tests/test_market_contracts.py"
      - "tests/test_prediction_quality.py"
      - "tests/test_model_governance.py"
      - "tests/test_market_side_shadow.py"
      - "tests/test_market_side_shadow_refresh.py"
      - "data/prediction_quality/full_market_surface_score_challenger_1/**"

permissions:
  contents: read

jobs:
  contract-and-regression:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run challenger focused tests
        run: python -m pytest -q tests/test_full_market_surface_score_challenger.py

      - name: Run production regression tests
        run: >-
          python -m pytest -q
          tests/test_market_contracts.py
          tests/test_prediction_quality.py
          tests/test_model_governance.py
          tests/test_market_side_shadow.py
          tests/test_market_side_shadow_refresh.py

      - name: Compile changed and reused Python paths
        run: >-
          python -m py_compile
          scripts/full_market_surface_score_challenger.py
          scripts/market_implied_score_baseline_audit.py
          scripts/market_contracts.py
          scripts/model_governance.py
          scripts/prediction_quality.py
          scripts/market_side_shadow.py
          scripts/market_side_shadow_refresh.py
          tests/test_full_market_surface_score_challenger.py

      - name: Parse and verify committed research evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/prediction_quality/full_market_surface_score_challenger_1")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          model = json.loads((root / "model.json").read_text(encoding="utf-8"))
          shadow = json.loads((root / "latest.json").read_text(encoding="utf-8"))
          assert summary["milestone"] == "FULL-MARKET-SURFACE-SCORE-CHALLENGER-1"
          assert summary["decision"] in {"FULL_MARKET_SURFACE_SHADOW_WIRED", "FULL_MARKET_SURFACE_EVALUATED_ONLY", "FAIL_CLOSED"}
          assert summary["integrity"]["status"] == "PASS"
          assert summary["integrity"]["production_enabled"] is False
          assert summary["integrity"]["user_visible"] is False
          assert summary["integrity"]["automatic_promotion"] is False
          assert summary["integrity"]["champion_c_serving_ui_changed"] is False
          assert summary["model_digest"] == model["model_digest"] == shadow["model_digest"]
          paired = summary["historical_evaluation"]["paired"]
          assert paired["paired_unique_match_n"] >= 50
          assert shadow["production_enabled"] is False
          assert shadow["user_visible"] is False
          assert shadow["row_count"] == len(shadow["rows"])
          assert summary["prospective_shadow"]["row_count"] == shadow["row_count"]
          assert all(row["prediction"]["rho"] == 0.0 for row in shadow["rows"])
          print({
              "decision": summary["decision"],
              "historical_paired_unique": paired["paired_unique_match_n"],
              "prospective_shadow_rows": shadow["row_count"],
              "model_digest": summary["model_digest"],
          })
          PY

      - name: Check diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Upload committed challenger evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-market-surface-score-challenger-1
          path: |
            data/prediction_quality/full_market_surface_score_challenger_1/summary.json
            data/prediction_quality/full_market_surface_score_challenger_1/model.json
            data/prediction_quality/full_market_surface_score_challenger_1/latest.json
            data/prediction_quality/full_market_surface_score_challenger_1/report.md
