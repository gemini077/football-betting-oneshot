name: Exact-score error decomposition audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/exact-score-decomp-rerun-20260909

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PRED-TRUST-2 pinned repository state
        uses: actions/checkout@v4
        with:
          ref: 5a1c50210ade07b5f69855e2d7d54e8ee260c338
          fetch-depth: 1

      - name: Restore accepted audit script without changing pinned data
        run: |
          git fetch --depth=1 origin 2a701443314767822e9fbfd6bd5c1c447ac1fb19
          git show FETCH_HEAD:scripts/exact_score_error_decomposition_audit.py > scripts/exact_score_error_decomposition_audit.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate audit artifact
        run: python scripts/exact_score_error_decomposition_audit.py --output-dir audit-artifact

      - name: Upload summary and report
        uses: actions/upload-artifact@v4
        with:
          name: exact-score-error-decomposition-audit
          path: |
            audit-artifact/summary.json
            audit-artifact/report.md

# Isolated research rerun only; never merge this trigger change.
