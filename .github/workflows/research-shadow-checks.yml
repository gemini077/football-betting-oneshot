name: Research shadow checks

on:
  push:
    branches: [main]
    paths:
      - 'greenfield/research/gf21*.py'
      - 'greenfield/results/gf21*.json.gz'
      - 'tests/test_gf21*.py'
      - 'scripts/market_score_math.py'
      - 'scripts/market_asian_totals.py'
      - 'scripts/market_side_shadow.py'
      - 'tests/test_market_side_shadow.py'
      - 'tests/test_market_side_shadow_refresh.py'
      - 'scripts/research_scorecard_public.py'
      - 'scripts/pme_champion_paired_audit.py'
      - 'scripts/pme_paired_public.py'
      - 'scripts/pme_forward_score_calibration.py'
      - 'tests/test_pme_forward_score_calibration.py'
      - 'tests/test_gf228_pme_champion_paired_audit.py'
      - 'tests/test_gf229_pme_paired_public.py'
      - 'scripts/rolling_market_shadow.py'
      - 'scripts/rolling_market_shadow_settlement.py'
      - 'tests/test_gf22*.py'
      - 'tests/test_gf233_paired_audit_durability.py'
      - '.github/workflows/deploy-pages.yml'
      - 'tests/test_gf231_de_team_identity.py'
      - '.github/workflows/research-shadow-checks.yml'
  workflow_dispatch:
  # Re-evaluate the real settled cohort daily, without changing any production forecasts.
  schedule:
    - cron: '43 07 * * *'

permissions:
  contents: read

concurrency:
  group: fbos-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-prediction-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research test dependencies
        run: python -m pip install pytest
      - name: Verify frozen market research and paired audit
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_gf214_preko_bet365_shadow.py \
            tests/test_market_asian_totals.py \
            tests/test_gf215_preko_pair_blend.py \
            tests/test_gf216_frozen_three_arm_settlement.py \
            tests/test_gf218_research_scorecard_public.py \
            tests/test_gf220_rolling_market_shadow.py \
            tests/test_gf221_rolling_market_shadow_settlement.py \
            tests/test_gf228_pme_champion_paired_audit.py \
            tests/test_gf229_pme_paired_public.py \
            tests/test_gf233_paired_audit_durability.py \
            tests/test_pme_forward_score_calibration.py

      - name: Publish frozen-probability calibration diagnostics to job summary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pme_champion_paired_audit.py --repo-root . --output "$RUNNER_TEMP/paired-calibration.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"paired-calibration.json").read_text(encoding="utf-8"))
          calibration=report["score_calibration"]
          assert calibration["n"] == report["n"]
          rows=[
              "### Frozen score-probability calibration (RESEARCH ONLY)",
              f"Unique matched settled fixtures: {report['n']}",
              f"Actual 1-1 results: {calibration['observed1_1_count']} / {calibration['n']}",
              "| Method | Expected 1-1 results | 1-1 modal matches | Expected Top1 hits | Observed Top1 hits |",
              "|---|---:|---:|---:|---:|",
          ]
          for name in ("champion", "market"):
              m=calibration["methods"][name]
              rows.append(
                  f"| {name} | {m['expected_1_1_count']:.3f} | {m['modal_1_1_top1_count']} | "
                  f"{m['expected_top1_hits']:.3f} | {m['observed_top1_hits']} |"
              )
          rows.append(f"Provider bookmaker quote timestamps verified: {report['capture_provenance']['provider_quote_clock_verified_matches']} / {report['n']}.")
          rows.append("Modal frequency is not event probability. No model promotion, no training on settled rows.")
          for row in rows: print(row)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f: f.write(chr(10).join(rows)+chr(10))
          PY

      - name: Evaluate out-of-sample frozen score recalibration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pme_forward_score_calibration.py --repo-root . --output "$RUNNER_TEMP/gf240-forward.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'gf240-forward.json'
          report = json.loads(p.read_text(encoding='utf-8'))
          segments = report['segments']
          assert len(segments) >= 1, 'No legal whole-day holdout segments'
          names = ('champion', 'market_baseline', 'one_one_odds', 'draw_diagonal_odds', 'pmf_power')
          n = sum(x['test_n'] for x in segments)
          assert n > 0 and all(x['test_n'] > 0 for x in segments)
          rows = [
              '### Forward-chaining score-model experiments (research only)',
              f'Out-of-sample fixtures: {n}; whole UTC matchdays: {len(segments)}',
              '| Method | mean exact NLL ↓ | 1X2 RPS ↓ | Top1 / Top3 / Top5 | expected 1-1 / actual |',
              '|---|---:|---:|---:|---:|',
          ]
          pooled = {}
          for name in names:
              ms = [seg['methods'][name] for seg in segments]
              assert all(m['n'] == seg['test_n'] for m, seg in zip(ms, segments))
              nll = sum(m['nll']*m['n'] for m in ms)/n
              rps = sum(m['rps_1x2']*m['n'] for m in ms)/n
              top1 = sum(m['top1'] for m in ms)
              top3 = sum(m['top3'] for m in ms)
              top5 = sum(m['top5'] for m in ms)
              exp11 = sum(m['expected_1_1'] for m in ms)
              act11 = sum(m['observed_1_1'] for m in ms)
              pooled[name] = nll
              rows.append(f'| {name} | {nll:.5f} | {rps:.5f} | {top1}/{top3}/{top5} | {exp11:.2f}/{act11} |')
          for name in names[1:]:
              rows.append(f'{name} - Champion exact NLL: {pooled[name]-pooled["champion"]:+.5f}')
          import random
          rows.extend([
              '| Holdout UTC day | Matches | Selected 1-1 tilt | ΔNLL (tilt−Champion) | ΔTop1 |',
              '|---|---:|---:|---:|---:|',
          ])
          for seg in segments[-14:]:
              base = seg['methods']['champion']
              cand = seg['methods']['one_one_odds']
              rows.append(
                  f"| {seg['utc_matchday']} | {seg['test_n']} | {seg['coefficients']['one_one_odds']:.2f} | "
                  f"{cand['nll']-base['nll']:+.5f} | {cand['top1']-base['top1']:+d} |"
              )
          improvements = sum(
              seg['methods']['one_one_odds']['nll'] < seg['methods']['champion']['nll']
              for seg in segments
          )
          rng = random.Random(240)
          boot = []
          for _ in range(5000):
              sampled = [segments[rng.randrange(len(segments))] for __ in segments]
              denom = sum(seg['test_n'] for seg in sampled)
              delta = sum(
                  (seg['methods']['one_one_odds']['nll']-seg['methods']['champion']['nll'])
                  * seg['test_n'] for seg in sampled
              )/denom
              boot.append(delta)
          boot.sort()
          rows.append(
              f"1-1 tilt improves NLL on {improvements}/{len(segments)} held-out days; "
              f"matchday-cluster bootstrap ΔNLL 95% interval "
              f"[{boot[125]:+.5f}, {boot[4875]:+.5f}] (exploratory; only {len(segments)} dates)."
          )
          rows.append('Coefficients selected using previous UTC days only; no same-day label leakage. No tuning or promotion of the deployed Champion.')
          for row in rows: print(row)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(chr(10).join(rows)+chr(10))
          PY

      - name: Verify lossless frozen market-side pair storage
        env:
          PYTHONPATH: '.:./scripts'
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_market_side_shadow.py \
            tests/test_market_side_shadow_refresh.py

      - name: Verify source-proven club aliases and Nowscore identity
        env:
          PYTHONPATH: '.:./scripts'
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_gf231_de_team_identity.py \
            tests/test_gf219_atletico_team_identity.py \
            tests/test_nowscore_markets.py
