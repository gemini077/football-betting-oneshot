name: Research shadow checks

on:
  push:
    branches: [main]
    paths:
      - 'greenfield/research/gf21*.py'
      - 'greenfield/results/gf21*.json.gz'
      - 'tests/test_gf21*.py'
      - 'scripts/market_score_math.py'
      - 'scripts/market_asian_totals.py'
      - 'scripts/market_side_shadow.py'
      - 'tests/test_market_side_shadow.py'
      - 'tests/test_market_side_shadow_refresh.py'
      - 'scripts/research_scorecard_public.py'
      - 'scripts/pme_champion_paired_audit.py'
      - 'scripts/pme_paired_public.py'
      - 'tests/test_gf228_pme_champion_paired_audit.py'
      - 'tests/test_gf229_pme_paired_public.py'
      - 'scripts/rolling_market_shadow.py'
      - 'scripts/rolling_market_shadow_settlement.py'
      - 'tests/test_gf22*.py'
      - 'tests/test_gf233_paired_audit_durability.py'
      - '.github/workflows/deploy-pages.yml'
      - 'tests/test_gf231_de_team_identity.py'
      - '.github/workflows/research-shadow-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fbos-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-prediction-research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research test dependencies
        run: python -m pip install pytest
      - name: Verify frozen market research and paired audit
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_gf214_preko_bet365_shadow.py \
            tests/test_market_asian_totals.py \
            tests/test_gf215_preko_pair_blend.py \
            tests/test_gf216_frozen_three_arm_settlement.py \
            tests/test_gf218_research_scorecard_public.py \
            tests/test_gf220_rolling_market_shadow.py \
            tests/test_gf221_rolling_market_shadow_settlement.py \
            tests/test_gf228_pme_champion_paired_audit.py \
            tests/test_gf229_pme_paired_public.py \
            tests/test_gf233_paired_audit_durability.py

      - name: Publish frozen-probability calibration diagnostics to job summary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pme_champion_paired_audit.py --repo-root . --output "$RUNNER_TEMP/paired-calibration.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"paired-calibration.json").read_text(encoding="utf-8"))
          calibration=report["score_calibration"]
          assert calibration["n"] == report["n"]
          rows=[
              "### Frozen score-probability calibration (RESEARCH ONLY)",
              f"Unique matched settled fixtures: {report['n']}",
              f"Actual 1-1 results: {calibration['observed1_1_count']} / {calibration['n']}",
              "| Method | Expected 1-1 results | 1-1 modal matches | Expected Top1 hits | Observed Top1 hits |",
              "|---|---:|---:|---:|---:|",
          ]
          for name in ("champion", "market"):
              m=calibration["methods"][name]
              rows.append(
                  f"| {name} | {m['expected_1_1_count']:.3f} | {m['modal_1_1_top1_count']} | "
                  f"{m['expected_top1_hits']:.3f} | {m['observed_top1_hits']} |"
              )
          rows.append(f"Provider bookmaker quote timestamps verified: {report['capture_provenance']['provider_quote_clock_verified_matches']} / {report['n']}.")
          rows.append("Modal frequency is not event probability. No model promotion, no training on settled rows.")
          for row in rows: print(row)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f: f.write(chr(10).join(rows)+chr(10))
          PY

      - name: Verify lossless frozen market-side pair storage
        env:
          PYTHONPATH: '.:./scripts'
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_market_side_shadow.py \
            tests/test_market_side_shadow_refresh.py

      - name: Verify source-proven club aliases and Nowscore identity
        env:
          PYTHONPATH: '.:./scripts'
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_gf231_de_team_identity.py \
            tests/test_gf219_atletico_team_identity.py \
            tests/test_nowscore_markets.py
