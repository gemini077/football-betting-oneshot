name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
    # Research-only pushes use a fast CI workflow; retain 30-minute production schedule.
    paths:
      - 'scripts/**'
      - '!scripts/rolling_market_shadow.py'
      - '!scripts/rolling_market_shadow_settlement.py'
      - 'config/**'
      - 'src/**'
      - 'frontend/**'
      - 'templates/**'
      - 'assets/**'
      - 'static/**'
      - 'web/**'
      - 'requirements.txt'
      - '.github/actions/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  schedule:
    # Deterministic maintenance only; no LLM/API token use.
    # Resubscribe the actor after the schedule stopped triggering; UTC, same 30-minute cadence.
    - cron: "12,42 * * * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: football-betting-oneshot-write
  queue: max
  cancel-in-progress: false

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_SNAPSHOT_ENDPOINT_URL: ${{ vars.FOOTBALL_DATA_SNAPSHOT_ENDPOINT_URL }}
      FOOTBALL_DATA_SNAPSHOT_BUCKET: ${{ vars.FOOTBALL_DATA_SNAPSHOT_BUCKET }}
      FOOTBALL_DATA_SNAPSHOT_REGION: ${{ vars.FOOTBALL_DATA_SNAPSHOT_REGION }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync latest durable state
        run: git pull --rebase origin main

      - name: Bootstrap verified football data
        uses: ./.github/actions/bootstrap-football-data
        with:
          runtime-access-key-id: ${{ secrets.FOOTBALL_DATA_SNAPSHOT_RUNTIME_ACCESS_KEY_ID }}
          runtime-secret-access-key: ${{ secrets.FOOTBALL_DATA_SNAPSHOT_RUNTIME_SECRET_ACCESS_KEY }}

      - name: Run production cycle
        id: production_cycle
        run: python scripts/automation_cycle.py

      - name: Classify generated data durability
        id: generated_data_gate
        if: ${{ always() }}
        shell: bash
        env:
          CYCLE_OUTCOME: ${{ steps.production_cycle.outcome }}
        run: |
          python scripts/refresh_durability_gate.py \
            --cycle-result data/product_runtime/latest_cycle.json \
            --data-root data \
            --cycle-outcome "$CYCLE_OUTCOME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Fail closed when refresh is not durable
        if: ${{ steps.generated_data_gate.outputs.ready != 'true' }}
        shell: bash
        run: |
          echo "Durability gate blocked write-back: ${{ steps.generated_data_gate.outputs.reason }}" >&2
          exit 1

      - name: Enforce cross-market report consistency
        run: python scripts/repair_report_consistency.py --root data/analysis_reports/current

      - name: Evaluate production health
        id: health
        run: |
          python scripts/production_health_watch.py \
            --runtime-snapshot-health "$FOOTBALL_DATA_RUNTIME_SNAPSHOT_HEALTH" \
            | tee health_watch_result.json

      - name: Regenerate current dashboard
        shell: bash
        run: |
          business_date="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["business_date"])' data/product_runtime/latest_cycle.json)"
          python scripts/prediction_dashboard.py --date "$business_date"

      - name: Evaluate frozen three-arm research shadow
        shell: bash
        run: |
          if python -m pytest -q tests/test_gf216_frozen_three_arm_settlement.py \
             && python -m greenfield.research.gf216_frozen_three_arm_settlement \
                --repo-root . \
                --output data/prediction_dashboard/gf216_research_review.json; then
            echo 'GF216 frozen three-arm research scorecard updated'
          else
            echo '::warning::GF216 research scorecard unavailable; daily predictions and Pages continue unchanged'
          fi

      - name: Capture and settle bounded rolling research shadow
        id: rolling_shadow
        continue-on-error: true
        shell: bash
        run: |
          set -e
          python -m pytest -q -p no:cacheprovider tests/test_market_asian_totals.py
          python -m pytest -q -p no:cacheprovider tests/test_gf220_rolling_market_shadow.py
          python -m pytest -q -p no:cacheprovider tests/test_gf221_rolling_market_shadow_settlement.py
          python -m pytest -q -p no:cacheprovider tests/test_gf218_research_scorecard_public.py
          python -m scripts.rolling_market_shadow --repo-root .
          python -m scripts.rolling_market_shadow_settlement --repo-root .
          echo 'GF220/GF221 bounded research capture and settlement: PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Report optional rolling research failure
        if: ${{ steps.rolling_shadow.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning::GF220/GF221 rolling research shadow failed; official predictions and Pages continue unchanged'
          echo 'GF220/GF221 bounded research capture and settlement: FAILED (official predictions and Pages unchanged)' >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate independent historical paired research
        id: historical_pair_audit
        continue-on-error: true
        shell: bash
        run: |
          set -e
          python -m pytest -q -p no:cacheprovider tests/test_gf228_pme_champion_paired_audit.py tests/test_gf229_pme_paired_public.py
          python -m scripts.pme_champion_paired_audit --repo-root .
          echo 'GF228/229 historical prospective paired audit: PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Report optional historical paired failure
        if: ${{ steps.historical_pair_audit.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning::GF228/229 research audit failed; daily predictions and Pages continue unchanged'
          echo 'GF228/229 historical paired research: FAILED' >> "$GITHUB_STEP_SUMMARY"

      - name: Save generated public data
        if: ${{ !cancelled() && steps.generated_data_gate.outputs.ready == 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(data/schedule_updates data/match_workspace data/fetch_runs data/market_history data/match_archive data/analysis_inputs data/analysis_reports data/analysis_jobs data/provider_match_crosswalk.json data/live_ev_profiles data/postmatch_automation data/postmatch_reviews data/postmatch_reports data/postmatch_dashboard data/paper_ledger data/prediction_universe data/base_prediction_jobs data/model_governance/predictions data/model_governance/input_snapshots data/model_governance/prediction_exclusions data/prospective data/prediction_quality/market_side_shadow_1 data/prediction_quality/research_shadow_monthly data/prediction_quality/pure_market_exact_prospective_1 data/prediction_quality/current_champion_trust.json data/prediction_quality/current_champion_trust.md data/model_benchmarks/predictions data/model_benchmarks/settlements data/prediction_dashboard data/product_runtime)
          existing=()
          for path in "${paths[@]}"; do
            [[ -e "$path" ]] && existing+=("$path")
          done
          if ((${#existing[@]})); then
            git add -A -- "${existing[@]}"
          fi
          # Monitor churn without deleting any trust-critical historical evidence.
          changed_files="$(git diff --cached --name-only -z | python -c 'import sys; print(sum(bool(p) for p in sys.stdin.buffer.read().split(bytes([0]))))')"
          echo "FBOS staged data files: ${changed_files}" >> "$GITHUB_STEP_SUMMARY"
          if (( changed_files > 200 )); then
            echo "::warning::FBOS data growth: ${changed_files} changed files in one cycle, review retention"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "refresh public football data [skip ci]"
            stash_created=false
            if [[ -n "$(git status --porcelain)" ]]; then
              git stash push --include-untracked -m "ci-transient-production-files"
              stash_created=true
            fi
            python scripts/durable_main_write.py \
              --remote origin \
              --branch main \
              --max-attempts 3 \
              --retry-delay-seconds 2
            if [[ "$stash_created" == "true" ]]; then
              git stash pop
            fi
          fi

      - name: Verify formal settled scorecard
        run: python -m pytest -q tests/test_formal_scorecard_public.py
      - name: Verify published match report links
        run: python -m pytest -q tests/test_public_report_link.py
      - name: Verify dashboard business-day separation
        run: python -m pytest -q tests/test_dashboard_business_day_grouping.py

      - name: Rebuild Pages artifact after data save
        run: python scripts/build_public_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify production health issue
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_RESULT: health_watch_result.json
        shell: bash
        run: |
          set -euo pipefail
          title='[PRODUCTION] Football MVP health alert'
          issue_number="$(gh issue list --state open --search 'production health alert in:title' --json number,title --jq '.[] | select(.title == "[PRODUCTION] Football MVP health alert") | .number' | head -n 1)"
          status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$HEALTH_RESULT")"
          notify="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1], encoding="utf-8"))["notify"]).lower())' "$HEALTH_RESULT")"
          if [[ "$notify" == "true" ]]; then
            business_date="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("business_date") or "unknown")' "$HEALTH_RESULT")"
            reasons="$(python -c 'import json,sys; print("\\n".join("- " + str(x) for x in json.load(open(sys.argv[1], encoding="utf-8")).get("reasons", [])))' "$HEALTH_RESULT")"
            detected_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            body=$(cat <<EOF
          Production health alert

          Status:
          $status

          Detected at:
          $detected_at

          Business date:
          $business_date

          Reasons:
          $reasons

          Workflow:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Main SHA:
          ${{ github.sha }}

          Developer action:
          Inspect production runtime and the named failing subsystem.
          EOF
          )
            if [[ -n "$issue_number" ]]; then
              gh issue edit "$issue_number" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [[ "$status" == "HEALTHY" && -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body 'Production health recovered automatically.'
            gh issue close "$issue_number"
          fi

      - name: Notify workflow failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[PRODUCTION] Football MVP health alert'
          issue_number="$(gh issue list --state open --search 'production health alert in:title' --json number,title --jq '.[] | select(.title == "[PRODUCTION] Football MVP health alert") | .number' | head -n 1)"
          detected_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body=$(cat <<EOF
          Production health alert

          Status:
          ALERT

          Detected at:
          $detected_at

          Business date:
          unknown

          Reasons:
          - WORKFLOW_HARD_FAILURE

          Workflow:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Commit SHA:
          ${{ github.sha }}

          Developer action:
          Inspect the failed GitHub Actions run and the named failing subsystem.
          EOF
          )
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
