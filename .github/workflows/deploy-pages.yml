name: Refresh data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Deterministic maintenance only; no LLM/API token use.
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: football-betting-oneshot-write
  cancel-in-progress: false

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run production cycle
        run: python scripts/automation_cycle.py

      - name: Enforce cross-market report consistency
        run: python scripts/repair_report_consistency.py --root data/analysis_reports/current

      - name: Save generated public data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(data/schedule_updates data/match_workspace data/fetch_runs data/market_history data/match_archive data/analysis_inputs data/analysis_reports data/analysis_jobs data/provider_match_crosswalk.json data/live_ev_profiles data/postmatch_automation data/postmatch_reviews data/postmatch_reports data/postmatch_dashboard data/paper_ledger data/prediction_universe data/base_prediction_jobs data/model_governance/predictions data/model_governance/input_snapshots data/model_governance/prediction_exclusions data/prospective data/prediction_dashboard data/product_runtime)
          existing=()
          for path in "${paths[@]}"; do
            [[ -e "$path" ]] && existing+=("$path")
          done
          if ((${#existing[@]})); then
            git add -A -- "${existing[@]}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "refresh public football data [skip ci]"
            git stash push --include-untracked -m "ci-transient-untracked-files" || true
            git pull --rebase origin main
            git push
          fi

      - name: Rebuild Pages artifact after data save
        run: python scripts/build_public_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
