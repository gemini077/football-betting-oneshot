name: GLOBAL test collection baseline

on:
  pull_request:
    paths:
      - "tests/test_live_ev_profile.py"
      - ".github/workflows/collection-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collection-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact PR head and bounded file scope
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          while IFS= read -r path; do
            case "$path" in
              tests/test_live_ev_profile.py|.github/workflows/collection-baseline.yml) ;;
              *) echo "out-of-scope file: $path"; exit 1 ;;
            esac
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Compile directly affected paths
        run: |
          python -m py_compile \
            scripts/build_public_site.py \
            scripts/generate_analysis_report.py \
            scripts/live_ev_profile.py \
            tests/test_live_ev_profile.py

      - name: Collect repository-wide tests
        id: collect
        shell: bash
        run: |
          mkdir -p collection-evidence
          set +e
          python -m pytest --collect-only -q > collection-evidence/pytest-collect.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            printf '%s\n' 'NEXT_COLLECTION_BLOCKER' > collection-evidence/decision.txt
            printf 'exit_status=%s\n' "$status" > collection-evidence/summary.txt
            cat collection-evidence/pytest-collect.log
            python - "$status" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path("collection-evidence/collection_result.json").write_text(
              json.dumps(
                  {
                      "decision": "NEXT_COLLECTION_BLOCKER",
                      "status": "FAILED_DURING_COLLECTION",
                      "exit_status": int(sys.argv[1]),
                      "command": "python -m pytest --collect-only -q",
                      "log": "pytest-collect.log",
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
            exit "$status"
          fi
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          log = Path("collection-evidence/pytest-collect.log").read_text(encoding="utf-8")
          matches = re.findall(r"(\d+)\s+tests?\s+collected", log)
          if not matches:
              raise SystemExit("pytest collection succeeded but exact collected count was not found")
          count = int(matches[-1])
          Path("collection-evidence/decision.txt").write_text(
              "GLOBAL_COLLECTION_BASELINE_RESTORED\n",
              encoding="utf-8",
          )
          Path("collection-evidence/collection_result.json").write_text(
              json.dumps(
                  {
                      "decision": "GLOBAL_COLLECTION_BASELINE_RESTORED",
                      "status": "COLLECTION_SUCCEEDED",
                      "collected_count": count,
                      "command": "python -m pytest --collect-only -q",
                      "log": "pytest-collect.log",
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          print(f"GLOBAL_COLLECTION_BASELINE_RESTORED: collected_count={count}")
          PY

      - name: Run directly affected public/live-EV focused tests
        if: ${{ steps.collect.outcome == 'success' }}
        run: |
          python -m pytest -q \
            tests/test_live_ev_profile.py \
            tests/test_build_public_site.py

      - name: Publish collection decision
        if: always()
        shell: bash
        run: |
          {
            echo "## GLOBAL-TEST-COLLECTION-BASELINE-RECOVERY-R1"
            echo
            cat collection-evidence/collection_result.json 2>/dev/null || true
            echo
            cat collection-evidence/decision.txt 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check generated evidence whitespace
        if: always()
        run: git diff --check

      - name: Upload exact-head collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-baseline-${{ github.event.pull_request.number || github.run_id }}
          path: collection-evidence
          if-no-files-found: error
          retention-days: 14
