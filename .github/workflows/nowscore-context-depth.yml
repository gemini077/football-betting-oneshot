name: Nowscore Context Depth and Recent Process

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/nowscore_prematch_adapters.py"
      - "scripts/nowscore_prematch_evidence.py"
      - "scripts/nowscore_context_depth_audit.py"
      - "schemas/nowscore_prematch_evidence.schema.json"
      - "tests/test_nowscore_context_depth.py"
      - "tests/test_nowscore_prematch_evidence.py"
      - ".github/workflows/nowscore-context-depth.yml"
  workflow_dispatch:
    inputs:
      business_date:
        description: "READY prediction-universe business date; blank selects the latest READY cohort"
        required: false
        default: ""
      max_matches:
        description: "Maximum future fixtures to fetch"
        required: false
        default: "12"

permissions:
  contents: read

jobs:
  exact-head-analysis-page:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head and bounded file scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          EXPECTED_HEAD="${HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            while IFS= read -r path; do
              case "$path" in
                scripts/nowscore_prematch_adapters.py|scripts/nowscore_prematch_evidence.py|scripts/nowscore_context_depth_audit.py|schemas/nowscore_prematch_evidence.schema.json|tests/test_nowscore_context_depth.py|tests/test_nowscore_prematch_evidence.py|.github/workflows/nowscore-context-depth.yml) ;;
                *) echo "out-of-scope file: $path"; exit 1 ;;
              esac
            done < <(git diff --name-only "$BASE_SHA...$EXPECTED_HEAD")
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused context-depth tests
        run: python -m pytest -q tests/test_nowscore_context_depth.py

      - name: Run prematch evidence regression tests
        run: python -m pytest -q tests/test_nowscore_prematch_evidence.py

      - name: Compile touched production and test paths
        run: |
          python -m py_compile \
            scripts/nowscore_prematch_adapters.py \
            scripts/nowscore_prematch_evidence.py \
            scripts/nowscore_context_depth_audit.py \
            tests/test_nowscore_context_depth.py \
            tests/test_nowscore_prematch_evidence.py

      - name: Run exact-head live natural-cohort audit
        shell: bash
        env:
          BUSINESS_DATE: ${{ inputs.business_date || '' }}
          MAX_MATCHES: ${{ inputs.max_matches || '12' }}
        run: |
          args=(--max-matches "$MAX_MATCHES" --output nowscore-context-depth-audit.json)
          if [[ -n "$BUSINESS_DATE" ]]; then
            args+=(--business-date "$BUSINESS_DATE")
          fi
          python scripts/nowscore_context_depth_audit.py "${args[@]}" | tee nowscore-context-depth-audit.log
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          report = json.loads(Path("nowscore-context-depth-audit.json").read_text(encoding="utf-8"))
          if report["run"]["exact_head"] != subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip():
              raise SystemExit("audit exact_head does not match checked-out HEAD")
          if report["coverage"]["selected_fixture_count"] <= 0:
              raise SystemExit("natural cohort is empty")
          for field, summary in report["coverage"]["fields"].items():
              print(json.dumps({
                  "field": field,
                  "eligible_fixture_count": summary["eligible_fixture_count"],
                  "present_count": summary["present_count"],
                  "state_counts": summary["state_counts"],
                  "reject_counts": summary["reject_counts"],
              }, ensure_ascii=False))
          request_count = report["request_count"]
          if request_count["delta"] != 0 or request_count["surface_sequence_violation_count"] != 0:
              raise SystemExit(f"request count proof failed: {request_count}")
          print(json.dumps({"request_count": request_count}, ensure_ascii=False))
          proof = report["boundary_proof"]
          for key in (
              "identity_violation_count",
              "side_binding_violation_count",
              "raw_body_persistence_count",
              "raw_marker_count",
              "media_analysis_promotion_count",
              "player_name_persistence_count",
          ):
              if proof[key] != 0:
                  raise SystemExit(f"boundary proof failed: {key}={proof[key]}")
          PY

      - name: Publish exact-head audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NOWSCORE-SAME-ID-CONTEXT-DEPTH-AND-RECENT-PROCESS-R1"
            echo
            cat nowscore-context-depth-audit.log 2>/dev/null || true
            echo
            cat nowscore-context-depth-audit.json 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check patch whitespace
        if: always()
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git diff --check
          fi

      - name: Upload exact-head audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nowscore-context-depth-${{ github.event.pull_request.number || github.run_id }}
          path: |
            nowscore-context-depth-audit.json
            nowscore-context-depth-audit.log
          if-no-files-found: error
          retention-days: 14
