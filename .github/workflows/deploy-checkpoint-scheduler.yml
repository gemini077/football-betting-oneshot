name: Deploy minute checkpoint scheduler

on:
  push:
    branches: [main]
    paths:
      - 'scheduler/cloudflare/src/worker.js'
      - 'scheduler/cloudflare/test/**'
      - 'scheduler/cloudflare/wrangler.toml'
      - '.github/workflows/deploy-checkpoint-scheduler.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fbos-checkpoint-worker-deploy
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify checkpoint batch scheduling before deploy
        working-directory: scheduler/cloudflare
        run: node --test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require Cloudflare deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SCHEDULER_GITHUB_TOKEN"
      - name: Deploy Worker and scheduler secret
        working-directory: scheduler/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
        run: |
          printf '%s' "$SCHEDULER_GITHUB_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN
          npx --yes wrangler@4 deploy
