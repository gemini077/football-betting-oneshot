name: Current universe rollover probe

on:
  pull_request:
    paths:
      - ".github/workflows/current-universe-rollover-probe.yml"
      - "scripts/probe_current_universe_rollover.py"
      - "tests/test_probe_current_universe_rollover.py"
      - "scripts/probe_nowscore_jc.py"
      - "scripts/probe_nowscore_business_date.py"
      - "tests/test_probe_nowscore_jc.py"
      - "tests/test_probe_nowscore_business_date.py"
      - "scripts/nowscore_markets.py"
      - "scripts/daily_schedule_workspace.py"
      - "scripts/prediction_universe.py"
      - "scripts/match_workspace.py"
      - "scripts/fetch_football_data.py"
      - "tests/test_nowscore_jc_universe.py"
      - "tests/test_daily_schedule_workspace.py"
      - "tests/test_prediction_universe.py"
  workflow_dispatch:
    inputs:
      business_date:
        description: Target current-universe business date (YYYY-MM-DD)
        required: true
        default: "2026-09-01"

permissions:
  contents: read

jobs:
  bounded-probe:
    runs-on: ubuntu-latest
    env:
      PROBE_DATE: ${{ inputs.business_date || '2026-09-01' }}
    steps:
      - name: Check out the dispatched ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run one-shot current-universe probe
        run: >-
          python scripts/probe_current_universe_rollover.py
          --date "$PROBE_DATE"
          --output current-universe-rollover-probe.json

      - name: Run Nowscore public JC contract probe
        run: >-
          python scripts/probe_nowscore_jc.py
          --date "$PROBE_DATE"
          --output nowscore-jc-probe.json

      - name: Replay Nowscore JC business-date contract
        run: >-
          python scripts/probe_nowscore_business_date.py
          --today 2026-09-01
          --date 2026-08-31
          --date 2026-09-01
          --output nowscore-business-date-probe.json

      - name: Upload exact probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: current-universe-rollover-probe-${{ inputs.business_date || '2026-09-01' }}
          path: |
            current-universe-rollover-probe.json
            nowscore-jc-probe.json
            nowscore-business-date-probe.json
          if-no-files-found: error
